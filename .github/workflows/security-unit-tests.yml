name: Security unit tests

on:
  pull_request:
    paths:
      - "backend/security/**"
      - "backend/routes_temp_media.py"
      - "backend/utils/security.py"
      - "backend/job_manager.py"
      - "backend/engines/remote_worker_engine.py"
      - "backend/services/subtitles_service.py"
      - "backend/utils/worker_config.py"
      - "backend/utils/generated_asset.py"
      - "src/components/MediaResultCard.jsx"
      - "docker-compose.yml"
      - "tests/test_worker_config.py"
      - "tests/test_generated_asset.py"
      - "tests/test_job_manager_reliability.py"
      - "tests/test_production_security_policy.py"
      - "backend/main.py"
      - "backend/job_manager.py"
      - "backend/engines/remote_worker_engine.py"
      - "backend/services/subtitles_service.py"
      - "backend/utils/worker_config.py"
      - "backend/utils/generated_asset.py"
      - "src/components/MediaResultCard.jsx"
      - "docker-compose.yml"
      - "tests/test_worker_config.py"
      - "tests/test_generated_asset.py"
      - "tests/test_job_manager_reliability.py"
      - "tests/test_production_security_policy.py"
      - "docs/PRODUCTION_COMPOSE_SECURITY.md"
      - "tests/test_temp_media_auth.py"
      - "tests/test_core.py"
      - "tests/test_rate_limit_failure_policy.py"
      - ".github/workflows/security-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/security/**"
      - "backend/routes_temp_media.py"
      - "backend/utils/security.py"
      - "tests/test_temp_media_auth.py"
      - "tests/test_core.py"
      - "tests/test_rate_limit_failure_policy.py"
      - ".github/workflows/security-unit-tests.yml"

permissions:
  contents: read

jobs:
  temp-media-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check starlette httpx static-ffmpeg
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Run temp media auth tests
        run: python tests/test_temp_media_auth.py
      - name: Run core security and URL tests
        run: python tests/test_core.py
      - name: Run rate limiter failure policy tests
        run: python tests/test_rate_limit_failure_policy.py
      - name: Run worker configuration tests
        run: python tests/test_worker_config.py
      - name: Run generated asset path tests
        run: python tests/test_generated_asset.py
      - name: Run durable job queue tests
        run: python tests/test_job_manager_reliability.py
      - name: Run production security policy tests
        run: python tests/test_production_security_policy.py
