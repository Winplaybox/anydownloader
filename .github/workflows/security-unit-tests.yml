name: Security and production readiness tests

on:
  pull_request:
    paths:
      - "backend/**"
      - "src/components/MediaResultCard.jsx"
      - "docker-compose.yml"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/security-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "src/components/MediaResultCard.jsx"
      - "docker-compose.yml"
      - "docs/**"
      - "tests/**"
      - ".github/workflows/security-unit-tests.yml"

permissions:
  contents: read

jobs:
  security-and-reliability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check starlette httpx static-ffmpeg
      - name: Compile backend and tests
        run: python -m compileall -q backend tests
      - name: Run temp media auth and URL tests
        run: python tests/test_temp_media_auth.py
      - name: Run core security and token tests
        run: python tests/test_core.py
      - name: Run rate limiter failure policy tests
        run: python tests/test_rate_limit_failure_policy.py
      - name: Run worker configuration tests
        run: python tests/test_worker_config.py
      - name: Run generated asset path tests
        run: python tests/test_generated_asset.py
      - name: Run durable job queue tests
        run: python tests/test_job_manager_reliability.py
      - name: Run production security policy tests
        run: python tests/test_production_security_policy.py
