name: Security unit tests

on:
  pull_request:
    paths:
      - "backend/security/**"
      - "backend/routes_temp_media.py"
      - "backend/utils/security.py"
      - "tests/test_temp_media_auth.py"
      - "tests/test_core.py"
      - ".github/workflows/security-unit-tests.yml"
  push:
    branches: [main]
    paths:
      - "backend/security/**"
      - "backend/routes_temp_media.py"
      - "backend/utils/security.py"
      - "tests/test_temp_media_auth.py"
      - "tests/test_core.py"
      - ".github/workflows/security-unit-tests.yml"

permissions:
  contents: read

jobs:
  temp-media-auth:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependency
        run: python -m pip install --disable-pip-version-check starlette httpx
      - name: Run temp media auth tests
        run: python tests/test_temp_media_auth.py
      - name: Run core security and URL tests
        run: python tests/test_core.py
