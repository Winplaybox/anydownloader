<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OVD Downloader PRO</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 380px;
      background: #090d16;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-badge {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #e11d48, #ec4899, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 14px;
      color: #fff;
    }
    .logo-title {
      font-weight: 800;
      font-size: 15px;
      color: #fff;
      letter-spacing: -0.3px;
    }
    .logo-title span {
      background: linear-gradient(90deg, #f43f5e, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge-pro {
      font-size: 9px;
      font-weight: 800;
      background: rgba(244, 63, 94, 0.15);
      color: #fb7185;
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid rgba(244, 63, 94, 0.3);
    }
    .input-label {
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      margin-bottom: 6px;
      display: flex;
      justify-content: space-between;
    }
    .input-box {
      width: 100%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 12px;
      outline: none;
      margin-bottom: 10px;
    }
    .input-box:focus {
      border-color: #f43f5e;
      box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.2);
    }
    .btn-fetch {
      width: 100%;
      background: linear-gradient(135deg, #e11d48, #ec4899);
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(225, 29, 72, 0.35);
      transition: all 0.2s;
    }
    .btn-fetch:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }
    .status-msg {
      font-size: 11px;
      margin-top: 10px;
      min-height: 16px;
      text-align: center;
    }
    .status-error { color: #fb7185; }
    .status-info { color: #38bdf8; }
    .result-area {
      margin-top: 12px;
      display: none;
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 12px;
    }
    .result-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .result-buttons {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .download-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #1e293b;
      color: #e2e8f0;
      text-decoration: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 700;
      transition: background 0.2s;
    }
    .download-btn:hover {
      background: #334155;
      color: #fff;
    }
    .download-btn.mp4 { border-left: 3px solid #f43f5e; }
    .download-btn.mp3 { border-left: 3px solid #f59e0b; }
    .download-btn.photo { border-left: 3px solid #ec4899; }
    .quick-links {
      margin-top: 14px;
      border-top: 1px solid #1e293b;
      padding-top: 10px;
      display: flex;
      justify-content: space-around;
      font-size: 11px;
    }
    .quick-link {
      color: #94a3b8;
      text-decoration: none;
      font-weight: 600;
    }
    .quick-link:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo-container">
      <div class="logo-badge">↓</div>
      <div class="logo-title">OVD <span>PRO</span></div>
    </div>
    <span class="badge-pro">v1.0 EXTENSION</span>
  </div>

  <div class="input-label">
    <span>Media URL:</span>
    <span id="detected-tag" style="color: #38bdf8; font-weight: normal;">Auto-detected from tab</span>
  </div>
  <input type="text" id="url-input" class="input-box" placeholder="Paste YouTube, Instagram, Facebook, or TikTok URL..." />

  <button type="button" id="fetch-btn" class="btn-fetch">
    <span>⚡ Download Media</span>
  </button>

  <div id="status" class="status-msg"></div>

  <div id="result-box" class="result-area">
    <div id="result-title" class="result-title"></div>
    <div id="result-buttons" class="result-buttons"></div>
  </div>

  <div class="quick-links">
    <a href="https://ovd.winplaybox.in" target="_blank" class="quick-link">Web App</a>
    <a href="https://ovd.winplaybox.in/youtube/top-100-youtube-channels" target="_blank" class="quick-link">Top Channels</a>
    <a href="https://ovd.winplaybox.in/instagram/top-100-instagram-accounts" target="_blank" class="quick-link">Top Instagram</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
