services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ovd-api
    restart: unless-stopped
    cpus: "${API_CPUS:-2.0}"
    mem_limit: "${API_MEMORY_LIMIT:-4g}"
    pids_limit: 256
    # Default to localhost behind a reverse proxy. Direct exposure is opt-in.
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${PORT:-8000}:8000"
    environment:
      PORT: "8000"
      WPB_ENV: production
      JOBS_DIR: /tmp/ovd_jobs
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:?Set PUBLIC_BASE_URL}"
      ALLOW_GENERIC_URLS: "${ALLOW_GENERIC_URLS:-true}"
      ADMIN_API_KEY: "${ADMIN_API_KEY:?Set ADMIN_API_KEY}"
      WPB_ADMIN_KEY: "${WPB_ADMIN_KEY:-}"
      TOKEN_HMAC_SECRET: "${TOKEN_HMAC_SECRET:?Set TOKEN_HMAC_SECRET}"
      EXTENSION_SECRET_KEY: "${EXTENSION_SECRET_KEY:?Set EXTENSION_SECRET_KEY}"
      WPB_VAULT_SECRET: "${WPB_VAULT_SECRET:?Set WPB_VAULT_SECRET}"
      JOB_OWNER_SECRET: "${JOB_OWNER_SECRET:?Set JOB_OWNER_SECRET}"
      COOKIE_POOL_PATH: /app/cookies
      WORKER_URL: "${WORKER_URL:-}"
      WORKER_SECRET: "${WORKER_SECRET:-}"
      WORKER_KEY: "${WORKER_KEY:-}"
      WORKER_RESULT_HOSTS: "${WORKER_RESULT_HOSTS:-}"
      WPB_ENABLE_MOCK_CHECKOUT: "0"
      JOB_MAX_SOURCE_MB: "${JOB_MAX_SOURCE_MB:-1024}"
      AUTOMATION_API_KEY: "${AUTOMATION_API_KEY:-}"
      REDIS_URL: redis://redis:6379/0
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      # AutoClip AI (isolated module, /api/autoclip/*). inline = render inside this container;
      # remote = start the autoclip-worker service below (profile "autoclip") and keep the API light.
      AUTOCLIP_ENABLED: "${AUTOCLIP_ENABLED:-1}"
      AUTOCLIP_WORKER_MODE: "${AUTOCLIP_WORKER_MODE:-inline}"
      AUTOCLIP_WORKER_KEY: "${AUTOCLIP_WORKER_KEY:-}"
      AUTOCLIP_DAILY_LIMIT: "${AUTOCLIP_DAILY_LIMIT:-3}"
      AUTOCLIP_MAX_UPLOAD_MB: "${AUTOCLIP_MAX_UPLOAD_MB:-500}"
      AUTOCLIP_MAX_SOURCE_MINUTES: "${AUTOCLIP_MAX_SOURCE_MINUTES:-90}"
      AUTOCLIP_COOKIES_FILE: "${AUTOCLIP_COOKIES_FILE:-}"
    volumes:
      - ./cookies:/app/cookies:ro
      - ovd_temp:/tmp/ovd_jobs
    depends_on:
      redis:
        condition: service_healthy

  # AutoClip render worker. Start with:  docker compose --profile autoclip up -d autoclip-worker
  # and set AUTOCLIP_WORKER_MODE=remote on the api service. Same image, talks to the API over the
  # private compose network. The same command runs on workers.winplaybox.in with a public AUTOCLIP_API_BASE.
  autoclip-worker:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["autoclip"]
    restart: unless-stopped
    cpus: "${AUTOCLIP_WORKER_CPUS:-2.0}"
    mem_limit: "${AUTOCLIP_WORKER_MEMORY:-3g}"
    pids_limit: 256
    command: ["python", "-m", "backend.autoclip.worker"]
    environment:
      AUTOCLIP_API_BASE: "${AUTOCLIP_API_BASE:-http://api:8000}"
      AUTOCLIP_WORKER_KEY: "${AUTOCLIP_WORKER_KEY:-}"  # worker refuses to start without a 32+ char key
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      AUTOCLIP_COOKIES_FILE: "${AUTOCLIP_COOKIES_FILE:-}"
      EDITOR_CACHE_DIR: /cache
    volumes:
      - ./cookies:/app/cookies:ro
      - autoclip_cache:/cache
    depends_on:
      - api

  redis:
    image: redis:7-alpine
    container_name: ovd-redis
    restart: unless-stopped
    cpus: "0.50"
    mem_limit: 512m
    # Redis is private to the Compose network; no host port is published.
    command: ["redis-server", "--appendonly", "yes", "--protected-mode", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  ovd_temp:
  redis_data:
  autoclip_cache:
